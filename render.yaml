# Blueprint do Render para o servidor de sinalização (WebSocket).
services:
  - type: web
    name: telepresenca-signaling
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OPERATOR_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
